<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rennkalender | GSRA</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>
</head>
<body>

    <header>
        <div class="logo-slogan-container">
            <a href="index.html" class="logo-link">
                <img src="logo.jpg" alt="GSRA Logo" class="logo">
            </a>
            <span class="header-slogan text-yellow">GLOBAL SIMRACING ALLIANCE</span>
        </div>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="nachschlagewerk.html">Nachschlagewerk</a>
            <a href="marktplatz.html">Marktplatz</a>
            <a href="kalender.html">Rennkalender</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>
    </header>

    <div class="container">
        
        <section class="hero-section">
            <h1 class="hero-title">OFFIZIELLER <span class="text-blue">RENNKALENDER</span></h1>
            <p class="hero-subtitle text-yellow">Alle anstehenden Simulationsevents auf einen Blick.</p>
        </section>

        <!-- ADMIN EINGABEMASKE (Nur sichtbar für Admins) -->
        <div id="admin-event-section" class="card" style="display: none; max-width: 800px; margin: 0 auto 40px auto; border-top-color: var(--gsra-yellow); text-align: left;">
            <h3><i class="fa-solid fa-calendar-plus text-yellow"></i> NEUES EVENT EINTRAGEN (ADMIN)</h3>
            <form id="create-event-form" style="margin-top: 15px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color: #fff; font-size: 13px;">Event-Titel</label>
                        <input type="text" id="ev-title" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Simulation</label>
                        <select id="ev-sim" style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                            <option value="iRacing">iRacing</option>
                            <option value="ACC">Assetto Corsa Competizione</option>
                            <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                            <option value="Automobilista 2">Automobilista 2</option>
                        </select>
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Strecke</label>
                        <input type="text" id="ev-track" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Datum & Uhrzeit</label>
                        <input type="datetime-local" id="ev-date" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <label style="color: #fff; font-size: 13px;">Server-Passwort (optional)</label>
                    <input type="text" id="ev-password" style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                </div>
                <button type="submit" class="login-btn" style="margin-top: 15px; cursor: pointer;">EVENT VERÖFFENTLICHEN</button>
            </form>
        </div>

        <!-- FILTER -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">RENNEN OVERVIEW</h2>
            <div>
                <label style="color: #fff; margin-right: 10px; font-weight: 600;">Filter:</label>
                <select id="filter-sim" style="padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    <option value="ALL">Alle Simulationen</option>
                    <option value="iRacing">iRacing</option>
                    <option value="ACC">ACC</option>
                    <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                    <option value="Automobilista 2">Automobilista 2</option>
                </select>
            </div>
        </div>

        <!-- EVENTS TABELLE -->
        <table class="event-table">
            <thead>
                <tr>
                    <th>Datum & Zeit</th>
                    <th>Event</th>
                    <th>Simulation</th>
                    <th>Strecke</th>
                    <th>Server-PW</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted);">Lade Events...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="supabase-client.js"></script>
    <script>
        let allEvents = [];

        async function initCalendar() {
            // Check Admin Status
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();
                
                if (profile && profile.role === 'admin') {
                    document.getElementById('admin-event-section').style.display = 'block';
                }
            }

            fetchEvents();
        }

        async function fetchEvents() {
            const { data, error } = await supabase
                .from('events')
                .select('*')
                .order('event_date', { ascending: true });

            if (error) {
                console.error("Fehler beim Laden:", error);
                return;
            }

            allEvents = data;
            renderEvents(allEvents);
        }

        function renderEvents(events) {
            const list = document.getElementById('events-list');
            list.innerHTML = '';

            if (events.length === 0) {
                list.innerHTML = `<tr><td colspan="5" style="text-align: center;">Keine anstehenden Events gefunden.</td></tr>`;
                return;
            }

            events.forEach(ev => {
                const dateFormatted = new Date(ev.event_date).toLocaleString('de-DE', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight: bold; color: var(--gsra-yellow);">${dateFormatted} Uhr</td>
                    <td style="font-weight: 600;">${ev.title}</td>
                    <td><span class="text-blue" style="font-weight: bold;">${ev.simulation}</span></td>
                    <td>${ev.track}</td>
                    <td>${ev.server_password ? `<code>${ev.server_password}</code>` : '<span style="opacity: 0.5;">Kein PW</span>'}</td>
                `;
                list.appendChild(row);
            });
        }

        // Event-Filter
        document.getElementById('filter-sim').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'ALL') {
                renderEvents(allEvents);
            } else {
                renderEvents(allEvents.filter(ev => ev.simulation === val));
            }
        });

        // Event Formular Submit (Admin)
        document.getElementById('create-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('ev-title').value;
            const simulation = document.getElementById('ev-sim').value;
            const track = document.getElementById('ev-track').value;
            const event_date = document.getElementById('ev-date').value;
            const server_password = document.getElementById('ev-password').value;

            const { data: { user } } = await supabase.auth.getUser();

            const { error } = await supabase.from('events').insert([{
                title,
                simulation,
                track,
                event_date,
                server_password: server_password || null,
                created_by: user.id
            }]);

            if (error) {
                alert("Fehler beim Erstellen: " + error.message);
            } else {
                alert("Event erfolgreich hinzugefügt!");
                document.getElementById('create-event-form').reset();
                fetchEvents();
            }
        });

        initCalendar();
    </script>
</body>
</html>
