<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rennkalender | GSRA</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>

    <style>
        /* Einheitsgröße für alle Formularfelder im Kalender */
        #create-event-form input,
        #create-event-form select {
            width: 100%;
            height: 42px;
            padding: 10px 12px;
            background: #0b0c10 !important;
            border: 1px solid var(--border-subtle) !important;
            color: #ffffff !important;
            border-radius: 4px !important;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Spezifische Anpassung für datetime-local ohne Layout-Sonderwege */
        input[type="datetime-local"] {
            appearance: none;
            -webkit-appearance: none;
            display: flex;
            align-items: center;
        }

        /* Hover- & Scale-Effekt AUSSCHLIESSLICH auf das Kalender-Icon */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
            opacity: 0.7;
            transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
        }

        input[type="datetime-local"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            transform: scale(1.2);
            filter: invert(0.7) sepia(1) saturate(5) hue-rotate(175deg); /* GSRA Blue Accent */
        }

        .btn-delete {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background: #ff4d4d;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span> 
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="marktplatz.html">MARKTPLATZ</a>
        <a href="setups.html">SETUPS</a>
        <a href="nachschlagewerk.html">NACHSCHLAGEWERK</a>
        <a href="kalender.html" class="active">RENNKALENDER</a>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="login.html" class="login-btn">LOGIN</a>
    </nav>
</header>

    <div class="container">
        
        <section class="hero-section">
            <h1 class="hero-title">OFFIZIELLER <span class="text-blue">RENNKALENDER</span></h1>
            <p class="hero-subtitle text-yellow">Alle anstehenden Simulationsevents auf einen Blick.</p>
        </section>

        <!-- ADMIN EINGABEMASKE -->
        <div id="admin-event-section" class="card" style="display: none; max-width: 800px; margin: 0 auto 40px auto; border-top-color: var(--gsra-yellow); text-align: left;">
            <h3><i class="fa-solid fa-calendar-plus text-yellow"></i> NEUES EVENT EINTRAGEN (ADMIN)</h3>
            <form id="create-event-form" style="margin-top: 15px;">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color: #fff; font-size: 13px;">Event-Titel</label>
                        <input type="text" id="ev-title" required>
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Simulation</label>
                        <select id="ev-sim">
                            <option value="iRacing">iRacing</option>
                            <option value="ACC">Assetto Corsa Competizione</option>
                            <option value="Assetto Corsa">Assetto Corsa</option>
                            <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                            <option value="Automobilista 2">Automobilista 2</option>
                        </select>
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Strecke</label>
                        <input type="text" id="ev-track" required>
                    </div>
                    <div>
                        <label style="color: #fff; font-size: 13px;">Datum & Uhrzeit</label>
                        <input type="datetime-local" id="ev-date" required>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <label style="color: #fff; font-size: 13px;">Server-Passwort (optional)</label>
                    <input type="text" id="ev-password">
                </div>
                <button type="submit" class="login-btn" style="margin-top: 15px; cursor: pointer;">EVENT VERÖFFENTLICHEN</button>
            </form>
        </div>

        <!-- FILTER -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0;">RENNEN OVERVIEW</h2>
            <div>
                <label style="color: #fff; margin-right: 10px; font-weight: 600;">Filter:</label>
                <select id="filter-sim" style="padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    <option value="ALL">Alle Simulationen</option>
                    <option value="iRacing">iRacing</option>
                    <option value="ACC">ACC</option>
                    <option value="Assetto Corsa">Assetto Corsa</option>
                    <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                    <option value="Automobilista 2">Automobilista 2</option>
                </select>
            </div>
        </div>

        <!-- EVENTS TABELLE -->
        <table class="event-table">
            <thead>
                <tr>
                    <th>Datum & Zeit</th>
                    <th>Event</th>
                    <th>Simulation</th>
                    <th>Strecke</th>
                    <th>Server-PW</th>
                    <th id="admin-header-action" style="display: none; text-align: right;">Aktion</th>
                </tr>
            </thead>
            <tbody id="events-list">
                <tr>
                    <td colspan="6" style="text-align: center; color: var(--text-muted);">Lade Events...</td>
                </tr>
            </tbody>
        </table>

    </div>

    <script src="kalender.js"></script>
</body>
</html>
