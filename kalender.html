<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rennkalender | GSRA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha256-7jvo3hkrl8sdc9HpXWuCux9rZYwPl8TvdX/DMZlu09M=" crossorigin="anonymous"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergrund.png" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span>
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="setups.html">Setups</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html" class="active">Rennkalender</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="messenger.html">Messenger</a>
        <a href="login.html" class="login-btn" id="loginNavBtn">Login</a>
        <button id="logoutBtn" class="login-btn" style="display: none;">Logout</button>
    </nav>
</header>

    <div class="container kal-page">

        <section class="hero-section kal-hero">
            <h1 class="hero-title">OFFIZIELLER <span class="text-blue">RENNKALENDER</span></h1>
            <p class="hero-subtitle text-yellow">Alle anstehenden Rennen und Events der GSRA-Community auf einen Blick.</p>
        </section>

        <!-- Nächstes Rennen mit Countdown -->
        <section id="kalNext" class="kal-next" hidden></section>

        <!-- Filter nach Simulation, Anzahl, Event eintragen (Moderationsteam) -->
        <div class="kal-toolbar">
            <div id="kalSims" class="kal-sims" role="group" aria-label="Nach Simulation filtern"></div>
            <div class="kal-toolbar-right">
                <span id="kalCount" class="kal-count"></span>
                <button type="button" id="kalCreateBtn" class="kal-create-btn" hidden><i class="fa-solid fa-calendar-plus"></i> Event eintragen</button>
            </div>
        </div>

        <!-- Events nach Monat gruppiert -->
        <div id="events-list" class="kal-list" aria-live="polite">
            <div class="kal-empty"><i class="fa-solid fa-spinner fa-spin"></i> Lade Events …</div>
        </div>
    </div>

    <!-- Event eintragen (nur Admins und Moderatoren) -->
    <div id="kalModal" class="gsra-dialog-overlay" hidden>
        <div class="gsra-dialog kal-dialog" role="dialog" aria-modal="true" aria-labelledby="kalModalTitle">
            <button type="button" class="gsra-dialog-close" id="kalModalClose" title="Schließen"><i class="fa-solid fa-xmark"></i></button>
            <div class="gsra-dialog-icon"><i class="fa-solid fa-calendar-plus"></i></div>
            <h3 class="gsra-dialog-title" id="kalModalTitle">Neues Event eintragen</h3>
            <form id="create-event-form" class="kal-form">
                <label class="kal-field kal-wide">
                    <span>Event-Titel</span>
                    <input type="text" id="ev-title" maxlength="120" placeholder="z. B. GT3 Sprint Cup – Lauf 3" required>
                </label>
                <label class="kal-field">
                    <span>Simulation</span>
                    <select id="ev-sim">
                        <option value="iRacing">iRacing</option>
                        <option value="ACC">Assetto Corsa Competizione</option>
                        <option value="Assetto Corsa">Assetto Corsa</option>
                        <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                        <option value="Automobilista 2">Automobilista 2</option>
                    </select>
                </label>
                <label class="kal-field">
                    <span>Strecke</span>
                    <input type="text" id="ev-track" maxlength="120" placeholder="z. B. Spa-Francorchamps" required>
                </label>
                <label class="kal-field">
                    <span>Datum &amp; Uhrzeit</span>
                    <input type="datetime-local" id="ev-date" required>
                </label>
                <label class="kal-field">
                    <span>Server-Passwort <small>(optional)</small></span>
                    <input type="text" id="ev-password" maxlength="80" autocomplete="off">
                </label>
                <div class="gsra-dialog-actions kal-wide">
                    <button type="button" class="gsra-dialog-btn secondary" id="kalModalCancel">Abbrechen</button>
                    <button type="submit" class="gsra-dialog-btn primary">Event veröffentlichen</button>
                </div>
            </form>
        </div>
    </div>

    <script src="ui-dialogs.js"></script>
    <script src="kalender.js"></script>
</body>
</html>
