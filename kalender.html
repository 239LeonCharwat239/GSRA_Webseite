<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rennkalender - GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">United by Speed.</span> 
            <span class="text-yellow">Driven globally.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html">Kalender</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

    <main class="container">
        <section style="margin-bottom: 40px;">
            <h2>Rennkalender & Events</h2>
            <p>Übersicht über kommende Rennen, Meisterschaften und Community-Verabredungen.</p>
        </section>

        <!-- Struktur für die zukünftigen Admin-Einträge -->
        <section>
            <table class="event-table">
                <thead>
                    <tr>
                        <th>Datum</th>
                        <th>Event-Bezeichnung</th>
                        <th>Simulation / Serie</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Hier bleiben die Zeilen vorerst leer, bis die Admins die ersten echten Daten eintragen -->
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
