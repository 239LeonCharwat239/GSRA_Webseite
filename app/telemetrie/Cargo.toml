[package]
name = "gsra-telemetrie"
version = "0.1.0"
edition = "2021"
description = "GSRA: liest Live-Daten aus Simulationen (zuerst iRacing) – nur lesend, mit Grenzprüfung"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }
