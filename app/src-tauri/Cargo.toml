[package]
name = "gsra-app"
version = "0.1.0"
description = "GSRA – Live-Telemetrie, Rundenvergleich und Renningenieur"
edition = "2021"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] } # unstable: eingebettete GSRA-Seiten im Hauptfenster (webbereich.rs)
# Nur aus Rust genutzt (feste Adresse der Webseite); die Oberfläche bekommt keine Erlaubnis, Seiten zu öffnen
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# Sprechtaste (sprache.rs): Spracherkennung auf dem PC (sherpa-onnx, Apache-2.0), Mikrofon (cpal), globale Taste,
# Modell-Download mit Prüfsumme (ureq + sha2)
sherpa-onnx = "2.0.3"
cpal = "0.15"
tauri-plugin-global-shortcut = "2"
ureq = "2.12"
sha2 = "0.10"
tauri-plugin-updater = "2.14.1"
serde_json = "1"

# Lenkrad-Knöpfe als Sprechtaste (lenkrad.rs): Raw Input + HID, nur lesend
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp"] }
gsra-telemetrie = { path = "../telemetrie" }

[dev-dependencies]
base64 = "0.23.1"
minisign-verify = "0.3.0"
