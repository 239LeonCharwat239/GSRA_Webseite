[package]
name = "gsra-app"
version = "0.1.0"
description = "GSRA – Live-Telemetrie, Rundenvergleich und Renningenieur"
edition = "2021"
license = "UNLICENSED"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Nur aus Rust genutzt (feste Adresse der Webseite); die Oberfläche bekommt keine Erlaubnis, Seiten zu öffnen
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
gsra-telemetrie = { path = "../telemetrie" }
