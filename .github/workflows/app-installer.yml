# GSRA-App – Installer bauen und als Download veröffentlichen (Wunsch 26.11.: „die App auf meinem PC installieren“).
# Läuft NUR, wenn ihr es auslöst: in GitHub unter „Actions › App-Installer › Run workflow“ (Versionsname eintragen)
# oder mit einem Tag „app-v…“. Ein frischer Windows-Rechner von GitHub baut den Installer (NSIS) aus genau diesem Stand
# und hängt ihn als „GSRA-Setup.exe“ (mit Prüfsumme) an ein Release. Der Link auf app.html
# (…/releases/latest/download/GSRA-Setup.exe) zeigt dann immer auf die neueste Fassung.
# Absicherung: Aktionen auf feste Versionen (Commit) gepinnt, Pakete exakt nach package-lock.json und Cargo.lock,
# Schreibrecht nur für Releases und nur in diesem Ablauf; der Versionsname wird geprüft (kein Einschleusen von Befehlen).
name: App-Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsname des Releases, z. B. app-v0.1.0"
        required: true
        default: "app-v0.1.0"
  push:
    tags: ["app-v*"]

permissions:
  contents: write

concurrency:
  group: app-installer
  cancel-in-progress: false

jobs:
  windows:
    name: Installer für Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Versionsname prüfen
        shell: pwsh
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ($env:VERSION -notmatch '^app-v\d+\.\d+\.\d+$') { throw "Der Versionsname muss so aussehen: app-v0.1.0" }
      - name: Abhängigkeiten (exakt nach package-lock.json)
        working-directory: app
        run: npm ci
      - name: Prüfungen der App (TypeScript, Logik-Tests)
        working-directory: app
        run: |
          npm run pruefen
          npm test
      - name: Installer bauen (exakt nach Cargo.lock)
        working-directory: app
        run: npx tauri build --bundles nsis -- --locked
      - name: Datei benennen und Prüfsumme
        shell: pwsh
        working-directory: app
        run: |
          $datei = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $datei) { throw "Der Installer fehlt." }
          Copy-Item $datei.FullName GSRA-Setup.exe
          "$((Get-FileHash GSRA-Setup.exe -Algorithm SHA256).Hash.ToLower())  GSRA-Setup.exe" | Out-File -Encoding ascii GSRA-Setup.exe.sha256
          Get-Content GSRA-Setup.exe.sha256
      - name: Als Release veröffentlichen
        shell: pwsh
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          gh release view $env:VERSION *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:VERSION --title "GSRA-App $($env:VERSION.Substring(5))" --notes "Installer für Windows 10/11. Prüfsumme in GSRA-Setup.exe.sha256." --latest
            if ($LASTEXITCODE -ne 0) { throw "Release ließ sich nicht anlegen." }
          }
          gh release upload $env:VERSION GSRA-Setup.exe GSRA-Setup.exe.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw "Hochladen fehlgeschlagen." }
