<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Registrierung | GSRA</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header>
        <div class="logo-slogan-container">
            <a href="index.html" class="logo-link">
                <img src="logo.jpg" alt="GSRA Logo" class="logo">
            </a>
            <span class="header-slogan text-yellow">GLOBAL SIMRACING ALLIANCE</span>
        </div>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="nachschlagewerk.html">Nachschlagewerk</a>
            <a href="marktplatz.html">Marktplatz</a>
            <a href="kalender.html">Rennkalender</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>
    </header>

    <div class="container">
        
        <div style="max-width: 450px; margin: 40px auto;" class="card">
            
            <!-- UMSCHALTER ZWISCHEN LOGIN UND REGISTRIERUNG -->
            <div style="display: flex; border-bottom: 1px solid var(--border-subtle); margin-bottom: 25px;">
                <button id="tab-login-btn" onclick="switchTab('login')" style="flex: 1; padding: 12px; background: none; border: none; color: var(--gsra-yellow); font-weight: bold; cursor: pointer; border-bottom: 2px solid var(--gsra-yellow);">LOGIN</button>
                <button id="tab-register-btn" onclick="switchTab('register')" style="flex: 1; padding: 12px; background: none; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer;">REGISTRIEREN</button>
            </div>

            <!-- ANZEIGE FÜR FEHLER UND ERFOLGSMELDUNGEN -->
            <div id="auth-message" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; text-align: center;"></div>

            <!-- LOGIN FORMULAR -->
            <form id="login-form">
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="color: #fff; font-size: 13px; display: block; margin-bottom: 5px;">E-Mail-Adresse</label>
                    <input type="email" id="login-email" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="color: #fff; font-size: 13px; display: block; margin-bottom: 5px;">Passwort</label>
                    <input type="password" id="login-password" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; box-sizing: border-box;">
                </div>
                <button type="submit" class="login-btn" style="width: 100%; padding: 12px; cursor: pointer;">ANMELDEN</button>
            </form>

            <!-- REGISTRIERUNG FORMULAR -->
            <form id="register-form" style="display: none;">
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="color: #fff; font-size: 13px; display: block; margin-bottom: 5px;">Fahrerneigung / Displayname</label>
                    <input type="text" id="register-username" placeholder="z. B. Max Mustermann" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="color: #fff; font-size: 13px; display: block; margin-bottom: 5px;">E-Mail-Adresse</label>
                    <input type="email" id="register-email" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="color: #fff; font-size: 13px; display: block; margin-bottom: 5px;">Passwort (min. 6 Zeichen)</label>
                    <input type="password" id="register-password" required style="width: 100%; padding: 10px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; box-sizing: border-box;">
                </div>
                <button type="submit" class="login-btn" style="width: 100%; padding: 12px; cursor: pointer;">KONTO ERSTELLEN</button>
            </form>

        </div>

    </div>

    <script src="supabase-client.js"></script>
    <script>
        function showMessage(msg, isError = false) {
            const box = document.getElementById('auth-message');
            box.style.display = 'block';
            box.style.background = isError ? 'rgba(255, 77, 77, 0.2)' : 'rgba(77, 255, 120, 0.2)';
            box.style.border = isError ? '1px solid #ff4d4d' : '1px solid #4dff78';
            box.style.color = isError ? '#ff4d4d' : '#4dff78';
            box.textContent = msg;
        }

        function switchTab(tab) {
            document.getElementById('auth-message').style.display = 'none';
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
                document.getElementById('tab-login-btn').style.color = 'var(--gsra-yellow)';
                document.getElementById('tab-login-btn').style.borderBottom = '2px solid var(--gsra-yellow)';
                document.getElementById('tab-register-btn').style.color = 'var(--text-muted)';
                document.getElementById('tab-register-btn').style.borderBottom = 'none';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
                document.getElementById('tab-register-btn').style.color = 'var(--gsra-yellow)';
                document.getElementById('tab-register-btn').style.borderBottom = '2px solid var(--gsra-yellow)';
                document.getElementById('tab-login-btn').style.color = 'var(--text-muted)';
                document.getElementById('tab-login-btn').style.borderBottom = 'none';
            }
        }

        // LOGIN SUBMIT
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                showMessage("Login fehlgeschlagen: " + error.message, true);
            } else {
                showMessage("Login erfolgreich! Leite weiter...", false);
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }
        });

        // REGISTRIERUNG SUBMIT
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: { username: username }
                }
            });

            if (error) {
                showMessage("Registrierung fehlgeschlagen: " + error.message, true);
            } else {
                showMessage("Registrierung erfolgreich! Bitte prüfe deine E-Mails oder melde dich an.", false);
            }
        });
    </script>
</body>
</html>
