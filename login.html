<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-Login - GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">United by Speed.</span> 
            <span class="text-yellow">Driven globally.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html">Kalender</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="container">
    <section style="max-width: 450px; margin: 40px auto; background-color: var(--bg-card); padding: 30px; border-radius: 6px; border: 1.5px solid var(--border-subtle); text-align: left;">
        <h2 style="margin-bottom: 15px; border-bottom: 2px solid var(--gsra-blue); padding-bottom: 5px;">Member & Team Login</h2>
        <p style="font-size: 14px; margin-bottom: 25px; color: var(--text-muted);">Exklusiver Zugang für das Team und Pro-Mitglieder zur Event-Planung und den internen Absprachen.</p>
        
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">E-Mail-Adresse</label>
                <input type="email" id="email" placeholder="name@gsra.de" required style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
            </div>
            <div>
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">Passwort</label>
                <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
            </div>
            
            <button type="submit" style="background-color: var(--gsra-blue); color: var(--text-light); border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;">Anmelden</button>
            <button type="button" id="signUpBtn" style="background-color: transparent; color: var(--gsra-yellow); border: 1px solid var(--gsra-yellow); padding: 10px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer;">Neues Konto erstellen</button>
        </form>
    </section>
</main>

<script>
    const SUPABASE_URL = 'https://mqqyvpmddaastacldbyy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_S0qff_7dIGbnyw33CsxwIA_qZy-9rjl';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginForm = document.getElementById('loginForm');

    // Login-Prozess
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            alert('Login fehlgeschlagen: ' + error.message);
        } else {
            window.location.href = 'dashboard.html';
        }
    });

    // Registrierungs-Prozess
    document.getElementById('signUpBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) {
            alert('Bitte gib E-Mail und Passwort ein.');
            return;
        }

        const { data, error } = await supabaseClient.auth.signUp({ email, password });

        if (error) {
            alert('Registrierung fehlgeschlagen: ' + error.message);
        } else {
            alert('Konto erfolgreich erstellt! Du wirst jetzt angemeldet.');
            window.location.href = 'dashboard.html';
        }
    });
</script>

</body>
</html>
