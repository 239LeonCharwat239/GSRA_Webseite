<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-Login - GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">United by Speed.</span> 
            <span class="text-yellow">Driven globally.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html">Kalender</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

    <main class="container">
        <section style="max-width: 450px; margin: 40px auto; background-color: var(--gray-light); padding: 30px; border-radius: 6px; border: 1.5px solid var(--border-color);">
            <h2 style="margin-bottom: 15px; border-left: none; padding-left: 0;">Member & Team Login</h2>
            <p style="font-size: 14px; margin-bottom: 25px;">Exklusiver Zugang für das Team und Pro-Mitglieder zur Event-Planung und den internen Absprachen.</p>
            
            <form style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-dark);">E-Mail-Adresse</label>
                    <input type="email" placeholder="name@gsra.de" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px;">
                </div>
                <div>
                    <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-dark);">Passwort</label>
                    <input type="password" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px;">
                </div>
                <button type="submit" style="background-color: var(--accent-blue); color: var(--bg-white); border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;">Anmelden</button>
            </form>
        </section>
    </main>

</body>
</html>
