<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-Login - GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- Supabase SDK & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha256-7jvo3hkrl8sdc9HpXWuCux9rZYwPl8TvdX/DMZlu09M=" crossorigin="anonymous"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergrund.png" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span> 
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="setups.html">Setups</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html">Rennkalender</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="messenger.html">Messenger</a>
        <a href="login.html" class="login-btn active" id="loginNavBtn">Login</a>
        <button id="logoutBtn" class="login-btn" style="display: none;">Logout</button>
    </nav>
</header>

<main class="container">
    <section style="max-width: 450px; margin: 40px auto; background-color: var(--bg-card); padding: 30px; border-radius: 6px; border: 1.5px solid var(--border-subtle); text-align: left;">
        <h2 style="margin-bottom: 15px; border-bottom: 2px solid var(--gsra-blue); padding-bottom: 5px;">Member & Team Login</h2>
        <p style="font-size: 14px; margin-bottom: 25px; color: var(--text-muted);">Exklusiver Zugang für das Team und Mitglieder zur Event-Planung und Aktivitätenverwaltung.</p>
        
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div id="usernameGroup" style="display: none;">
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">Benutzername / Name</label>
                <input type="text" id="username" placeholder="z. B. Max Mustermann" style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
            </div>

            <div>
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">E-Mail-Adresse</label>
                <input type="email" id="email" placeholder="name@gsra.de" required style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
            </div>
            
            <div>
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">Passwort</label>
                <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
                <button type="button" id="forgotPasswordBtn" style="background: none; border: none; color: var(--gsra-yellow); font-size: 13px; cursor: pointer; padding: 6px 0 0; text-decoration: underline;">Passwort vergessen?</button>
                <div id="passwordStrength" class="pw-strength" style="display: none;">
                    <div class="pw-strength-bar"><span></span></div>
                    <small class="pw-strength-text"></small>
                </div>
            </div>

            <div id="passwordRepeatGroup" style="display: none;">
                <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; color: var(--text-light);">Passwort wiederholen</label>
                <input type="password" id="passwordRepeat" placeholder="••••••••" autocomplete="new-password" style="width: 100%; padding: 10px; background-color: var(--bg-main); border: 1px solid var(--border-subtle); border-radius: 4px; font-size: 14px; color: var(--text-light);">
            </div>

            <label id="termsGroup" class="terms-check" style="display: none;">
                <input type="checkbox" id="acceptTerms">
                <span>Ich akzeptiere die <a href="nutzungsbedingungen.html" target="_blank">Nutzungsbedingungen</a> und habe die <a href="datenschutz.html" target="_blank">Datenschutzerklärung</a> gelesen.</span>
            </label>
            
            <button type="submit" id="submitBtn" style="background-color: var(--gsra-blue); color: var(--text-light); border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;">Anmelden</button>
            <button type="button" id="toggleModeBtn" style="background-color: transparent; color: var(--gsra-yellow); border: 1px solid var(--gsra-yellow); padding: 10px; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer;">Kein Konto? Jetzt registrieren</button>
        </form>
    </section>
</main>

<script src="ui-dialogs.js"></script>
<script src="login.js"></script>

</body>
</html>
