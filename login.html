<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registrierung | GSRA</title>
    
    <!-- GSRA Master Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome für Social Media Icons & Symbole -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS CDN (Wichtig für die Datenbank-Anbindung) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- =========================================
         HEADER & LOGO
    ========================================= -->
    <header>
        <div class="logo-slogan-container">
            <a href="index.html" class="logo-link">
                <img src="logo.jpg" alt="GSRA Logo" class="logo">
            </a>
            <span class="header-slogan text-yellow">GLOBAL SIMRACING ALLIANCE</span>
        </div>
        
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="nachschlagewerk.html">Nachschlagewerk</a>
            <a href="marktplatz.html">Marktplatz</a>
            <a href="kalender.html">Rennkalender</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>
    </header>

    <!-- =========================================
         MAIN CONTENT / AUTHENTIFIZIERUNG
    ========================================= -->
    <div class="container">
        
        <section class="hero-section">
            <h1 class="hero-title">WILLKOMMEN BEI DER <span class="text-blue">GSRA</span></h1>
            <p class="hero-subtitle text-yellow">Melde dich an oder erstelle ein Konto, um alle Features zu nutzen.</p>
        </section>

        <div class="card-grid" style="max-width: 900px; margin: 0 auto; align-items: start;">
            
            <!-- ANMELDE-FORMULAR -->
            <div class="card">
                <h3><i class="fa-solid fa-right-to-bracket text-blue"></i> ANMELDEN</h3>
                <p style="font-size: 14px; margin-bottom: 20px;">Gib deine Daten ein, um dich einzuloggen.</p>
                
                <form id="login-form">
                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">E-Mail Adresse</label>
                        <input type="email" id="login-email" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>
                    
                    <div style="margin-bottom: 20px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">Passwort</label>
                        <input type="password" id="login-password" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>

                    <button type="submit" class="login-btn" style="width: 100%; cursor: pointer;">EINLOGGEN</button>
                </form>
            </div>

            <!-- REGISTRIERUNGS-FORMULAR -->
            <div class="card" style="border-top-color: var(--gsra-yellow);">
                <h3><i class="fa-solid fa-user-plus text-yellow"></i> REGISTRIEREN</h3>
                <p style="font-size: 14px; margin-bottom: 20px;">Erstelle ein neues Konto für die GSRA Platform.</p>
                
                <form id="register-form">
                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">Benutzername</label>
                        <input type="text" id="reg-username" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">Vollständiger Name</label>
                        <input type="text" id="reg-fullname" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>

                    <div style="margin-bottom: 15px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">E-Mail Adresse</label>
                        <input type="email" id="reg-email" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>
                    
                    <div style="margin-bottom: 20px; text-align: left;">
                        <label style="color: var(--text-light); font-size: 14px; font-weight: 600;">Passwort</label>
                        <input type="password" id="reg-password" required style="width: 100%; padding: 12px; margin-top: 5px; background: #0b0c10; border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    </div>

                    <button type="submit" class="login-btn" style="width: 100%; cursor: pointer;">KONTO ERSTELLEN</button>
                </form>
            </div>

        </div>

    </div>

    <!-- =========================================
         SUPABASE INFRASTRUKTUR & SKRIPTE
    ========================================= -->
    <script src="supabase-client.js"></script>
    
    <script>
        // Login-Event Listener
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                alert("Login-Fehler: " + error.message);
            } else {
                alert("Erfolgreich eingeloggt!");
                window.location.href = "dashboard.html";
            }
        });

        // Registrierungs-Event Listener
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const fullName = document.getElementById('reg-fullname').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        username: username,
                        full_name: fullName
                    }
                }
            });

            if (error) {
                alert("Registrierungs-Fehler: " + error.message);
            } else {
                alert("Registrierung erfolgreich! Bitte überprüfe dein E-Mail-Postfach zur Bestätigung.");
                document.getElementById('register-form').reset();
            }
        });
    </script>
</body>
</html>
