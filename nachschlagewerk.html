<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachschlagewerk - GSRA</title>
    <meta name="description" content="Das Motorsport- und Simracing-Nachschlagewerk der GSRA: über 300 Begriffe aus Fahrwerk, Aerodynamik, Reifen, Bremsen, Antrieb, Fahrtechnik, Strategie, Regeln und Telemetrie ausführlich erklärt.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha256-7jvo3hkrl8sdc9HpXWuCux9rZYwPl8TvdX/DMZlu09M=" crossorigin="anonymous"></script>
    <script src="supabase-client.js"></script>
    <script src="fehler-monitor.js"></script>
    <script src="auth-nav.js"></script>
</head>
<body data-wissen="nachschlagewerk">

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergrund.png" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span>
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>
    <!-- Die Navigation baut auth-nav.js aus einer zentralen Liste (GSRA_NAV) -->
    <nav>
        <a href="index.html">Home</a>
        <a href="messenger.html">Messenger</a>
        <a href="login.html" class="login-btn" id="loginNavBtn">Login</a>
        <button id="logoutBtn" class="login-btn" style="display: none;">Logout</button>
    </nav>
</header>

    <main class="container">
        <section class="hero-section">
            <h1 class="hero-title">Motorsport- &amp; Physik-<span class="text-blue">Nachschlagewerk</span></h1>
            <p class="hero-subtitle">Über 300 Fachbegriffe aus Fahrwerk, Aerodynamik, Reifen, Technik, Fahrtechnik, Strategie und Simracing – ausführlich erklärt, mit Praxis-Tipps für Setup und Fahrstil.</p>
        </section>

        <section class="wissen-werkzeuge">
            <label class="wissen-suchfeld">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="wissenSuche" maxlength="60" autocomplete="off" placeholder="Begriff suchen, z. B. „Untersteuern“ oder „Camber“" aria-label="Nachschlagewerk durchsuchen">
            </label>
            <div class="wissen-chips" id="wissenFilter" role="group" aria-label="Kategorien"></div>
            <p class="wissen-zahl" id="wissenZahl"></p>
        </section>

        <section id="wissenListe" class="wissen-liste begriffe" aria-live="polite"></section>
    </main>

    <script type="module" src="src/wissen.ts"></script>
    <script type="module" src="src/suche.ts"></script>
</body>
</html>
