<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setups | GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>
    <style>
        .combo-box-container {
            position: relative;
            width: 100%;
        }
        .combo-box-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-subtle);
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .combo-box-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: #121620;
            border: 1px solid var(--border-subtle);
            border-top: none;
            border-radius: 0 0 4px 4px;
            z-index: 100;
            display: none;
        }
        .combo-option {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .combo-option:hover {
            background: rgba(255,204,0,0.15);
            color: var(--gsra-yellow);
        }
        .layout-tag {
            font-size: 11px;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--text-muted);
        }
        .vote-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
        }
        .vote-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .vote-btn.like-btn:hover { color: #00ff88; border-color: #00ff88; }
        .vote-btn.dislike-btn:hover { color: #ff4d4d; border-color: #ff4d4d; }
    </style>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span> 
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="marktplatz.html">MARKTPLATZ</a>
        <a href="setups.html" class="active">SETUPS</a>
        <a href="nachschlagewerk.html">NACHSCHLAGEWERK</a>
        <a href="kalender.html">RENNKALENDER</a>
        <a href="dashboard.html">DASHBOARD</a>
        <a href="login.html" class="login-btn">LOGIN</a>
    </nav>
</header>

<div class="container">
    <section class="hero-section">
        <h1 class="hero-title">TELEMETRIE & <span class="text-blue">SETUPS</span></h1>
        <p class="hero-subtitle text-yellow">Lade erprobte .sto-Dateien herunter oder teile deine eigenen Abstimmungen.</p>
    </section>

    <!-- UPLOAD CARD -->
    <div class="card" style="max-width: 800px; margin: 0 auto 30px auto;">
        <h3><i class="fa-solid fa-file-arrow-up text-blue"></i> .sto Setup-Datei hochladen</h3>
        
        <form id="setupUploadForm" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; text-align: left; margin-bottom: 5px; font-size: 13px; color: var(--text-muted);">Simulation</label>
                <select id="simSelect" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
                    <option value="iRacing">iRacing</option>
                    <option value="ACC">Assetto Corsa Competizione</option>
                    <option value="Assetto Corsa">Assetto Corsa</option>
                    <option value="Le Mans Ultimate">Le Mans Ultimate</option>
                    <option value="Automobilista 2">Automobilista 2</option>
                </select>
            </div>

            <div style="text-align: left;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted);">Fahrzeug</label>
                <div class="combo-box-container">
                    <input type="text" id="carInput" class="combo-box-input" placeholder="Fahrzeug suchen oder eingeben..." required autocomplete="off">
                    <div id="carDropdown" class="combo-box-dropdown"></div>
                </div>
            </div>

            <div style="text-align: left;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted);">Strecke & Layout</label>
                <div class="combo-box-container">
                    <input type="text" id="trackInput" class="combo-box-input" placeholder="Strecke oder Layout suchen..." required autocomplete="off">
                    <div id="trackDropdown" class="combo-box-dropdown"></div>
                </div>
            </div>

            <div style="text-align: left;">
                <label style="display: block; margin-bottom: 5px; font-size: 13px; color: var(--text-muted);">Wähle die .sto Datei aus:</label>
                <input type="file" id="setupFile" accept=".sto" required style="width: 100%; padding: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px;">
            </div>

            <button type="submit" class="btn-yellow" style="margin-top: 10px; padding: 12px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; background: var(--gsra-yellow); color: #000;">SETUP VERÖFFENTLICHEN</button>
            <p id="uploadStatus" style="font-size: 14px; margin-top: 5px;"></p>
        </form>
    </div>

    <!-- LISTE DER SETUPS -->
    <div class="card" style="max-width: 800px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;"><i class="fa-solid fa-download text-yellow"></i> Verfügbare Team-Setups</h3>
            <input type="text" id="searchSetup" placeholder="Suchen..." style="padding: 6px 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle); color: #fff; border-radius: 4px; width: 180px;">
        </div>

        <ul id="setupList" style="list-style: none; padding: 0; margin: 0; text-align: left;">
            <li style="color: var(--text-muted); text-align: center; padding: 15px;">Lade Setups...</li>
        </ul>
    </div>
</div>

<script src="setups.js"></script>
</body>
</html>
