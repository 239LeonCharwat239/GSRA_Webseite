<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - GSRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-nav.js"></script>
</head>
<body>

<header>
    <div class="logo-slogan-container">
        <a href="index.html" class="logo-link">
            <img src="GSRA_Logo_ohne Hintergund.jpeg" alt="GSRA Logo" class="logo">
        </a>
        <div class="header-slogan">
            <span class="text-blue">UNITED BY SPEED.</span> 
            <span class="text-yellow">DRIVEN GLOBALLY.</span>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="marktplatz.html">Marktplatz</a>
        <a href="nachschlagewerk.html">Nachschlagewerk</a>
        <a href="kalender.html">Rennkalender</a>
        <a href="login.html" class="login-btn">Login</a>
    </nav>
</header>

<main class="container">
    <section class="hero-section">
        <h1 class="hero-title">GSRA DASHBOARD</h1>
        <p class="hero-subtitle">
            <span class="text-white">Willkommen zurück: </span>
            <span id="userEmail" class="text-yellow">Lade Benutzerdaten...</span>
        </p>
    </section>

    <section class="card-grid">
        <div class="card">
            <h3>Pro-Bereich</h3>
            <p>Zugriff auf Telemetrie-Analysen und Setup-Datenbanken.</p>
        </div>
        <div class="card">
            <h3>Team-Planer</h3>
            <p>Verwaltung von Events, Stints und internen Absprachen.</p>
        </div>
    </section>
</main>

<script>
    // Schutzmechanismus: Prüfen ob Nutzer eingeloggt ist
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();

        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userEmail').textContent = user.email;
        }
    }

    // Abmelden
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        window.location.href = 'login.html';
    });

    checkUser();
</script>

</body>
</html>
